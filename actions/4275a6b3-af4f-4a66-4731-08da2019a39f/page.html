<h2>功能与基本使用</h2>
<p>用数字键选择记录或用空格键依次回贴剪贴板历史，适合连续填写。</p>
<ol>
<li>先运行主剪贴板动作，依次复制要使用的内容，然后把光标放在目标输入位置。</li>
<li>触发“连续粘贴”，查看剪贴板列表和操作提示。</li>
<li>按数字键粘贴对应选项；按 Space 粘贴当前项并选中下一项，再切换到下一个输入位置继续。</li>
<li>完成后按 Esc 退出连续粘贴。</li>
</ol>
<p>使用过程中请留意当前输入位置和列表选中项，避免把内容粘贴到其它窗口。</p>
</section>
