<h2>功能与基本使用</h2>
<p>针对选中的文件或文件夹显示快捷操作菜单，集中使用文件处理功能。</p>
<ol>
<li>先在资源管理器中选中需要处理的一个或多个文件、文件夹。</li>
<li>触发本动作，查看针对当前选择生成的文件菜单。</li>
<li>点击需要的菜单项执行；涉及修改文件的操作，请先确认当前选中的对象。</li>
</ol>
<p>动作会读取当前选择的文件路径；未选中文件时，请先返回资源管理器完成选择。</p>
</section>
<p>可一定程度上替代资源管理器</p><p><img src="https://files.getquicker.net/_sitefiles/kb/sharedaction/5042d4d2-2979-4fff-4a25-08da404596c9/2023/07/18/172900_113342_image.png"><br></p>
