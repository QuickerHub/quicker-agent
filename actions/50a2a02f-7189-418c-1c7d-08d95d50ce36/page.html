<h2>功能与基本使用</h2>
<p>获取浏览器当前活动标签页的网址并加入收藏，方便以后再次打开。</p>
<ol>
<li>安装 Quicker 浏览器扩展并连接 Quicker，然后在浏览器中打开要收藏的网页。</li>
<li>保持目标网页为该浏览器的活动标签页，触发“网址收藏”动作。</li>
<li>在“集锦”或主剪贴板的收藏夹中查看保存的网址；以后点击条目即可再次打开。</li>
</ol>
<p>动作依赖浏览器扩展读取当前标签页；无法获取网址时，请检查扩展连接状态。</p>
</section>
<p>收藏浏览器活动标签页（任何地方可运行动作）</p><p>动作使用</p><ul><li><font color="#ff0000">需安装 Quicker 浏览器扩展</font></li><li>收藏界面在动作剪贴板中打开</li></ul>
