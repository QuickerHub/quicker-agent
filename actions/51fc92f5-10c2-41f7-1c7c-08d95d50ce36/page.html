<h2>功能与基本使用</h2>
<p>收藏选中的内容；没有选区时收藏当前剪贴板内容，可在集锦中管理。</p>
<ol>
<li>在目标应用中选中需要保存的文字或其它内容，然后触发本动作。</li>
<li>动作会把获取到的内容加入收藏；没有选区时使用当前剪贴板中的内容。</li>
<li>打开“集锦”或主剪贴板的收藏夹，查看新条目，并按需要重命名或整理分类。</li>
</ol>
<p>如果目标应用无法直接读取选区，可先复制内容，再运行动作完成收藏。</p>
</section>
