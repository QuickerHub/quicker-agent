<h2>功能与基本使用</h2>
<p>在统一搜索框中查找剪贴板历史与收藏，选择结果后直接使用。</p>
<ol>
<li>先运行主剪贴板动作，使剪贴板历史和收藏数据可用。</li>
<li>触发 CeaBox 打开搜索框，输入需要查找的关键词。</li>
<li>在结果列表中选择剪贴板条目或收藏项，点击或按回车执行相应操作。</li>
</ol>
<p>可使用参数“search show favor”直接进入收藏搜索，或“search show clip”进入剪贴板搜索。</p>
</section>
<h5>准备工作</h5><ul><li>安装
<a href="https://getquicker.net/Sharedaction?code=9ec53d43-5539-4571-6886-08d8c752bfcb" target="_blank"><span>剪贴板</span></a>&nbsp;动作</li><li>更新quicker到1.31以上版本</li></ul><hr><h5></h5><h3><b>命令参数</b></h3><p>search show favor， 打开收藏夹</p><p>search show clip，打开剪贴板</p>
