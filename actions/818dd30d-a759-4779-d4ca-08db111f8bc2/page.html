<h2>功能与基本使用</h2>
<p>通过无焦点剪贴板菜单选择历史内容，保留原输入窗口的操作位置。</p>
<ol>
<li>先运行主剪贴板动作并复制所需内容，使历史列表中已有记录。</li>
<li>把光标放在需要粘贴的输入框中，再触发本动作打开无焦点剪贴板菜单。</li>
<li>用鼠标点击所需历史条目进行粘贴；按住 Ctrl 点击时可保留菜单，继续选择其它条目。</li>
</ol>
<p>这个入口使用无焦点菜单，与主剪贴板窗口的常规显示方式不同。</p>
</section>
<p>按住ctrl点击，可以不关闭窗口</p>
