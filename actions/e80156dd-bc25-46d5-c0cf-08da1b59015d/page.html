<h2>功能与基本使用</h2>
<p>把剪贴板历史中的第 2 项直接粘贴到当前输入位置。</p>
<ol>
<li>先运行主剪贴板动作，并至少复制两条内容，确保历史列表中存在第 2 项。</li>
<li>把输入光标放回需要填写内容的应用或输入框。</li>
<li>触发本动作，即可回贴历史列表中的第 2 项；内容以当前历史顺序为准。</li>
</ol>
<p>它读取的是剪贴板历史，不是 Windows 系统剪贴板中只能保存的当前一项。</p>
</section>
